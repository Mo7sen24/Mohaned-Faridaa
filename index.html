<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف ملوكية</title>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --dark-bg: #0d0d0d;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-bg);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* === Custom Gold Scrollbar with Glow === */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #000;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 5px;
      box-shadow: 0 0 10px var(--gold);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-light);
      box-shadow: 0 0 15px var(--gold-light);
    }

    /* === Card with Glassmorphism & Shimmer === */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 25px;
    }

    /* Glassmorphism Shimmer Line */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(212, 175, 55, 0.2),
        transparent
      );
      transform: skewX(-25deg);
      animation: shimmer 6s infinite;
    }

    @keyframes shimmer {
      0% { left: -150%; }
      20% { left: 150%; }
      100% { left: 150%; }
    }

    h1 {
      color: var(--gold);
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }

    p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    /* === Ambient Music Floating Icon & Notes === */
    .music-control-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .music-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--gold);
      color: var(--gold);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      transition: transform 0.3s, background 0.3s;
    }

    .music-btn:hover {
      transform: scale(1.1);
      background: rgba(212, 175, 55, 0.2);
    }

    /* Floating Musical Notes */
    .note {
      position: absolute;
      color: var(--gold-light);
      font-size: 1rem;
      pointer-events: none;
      animation: floatNote 2s ease-out forwards;
      opacity: 0;
    }

    @keyframes floatNote {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-30px, -60px) scale(1.4) rotate(-20deg);
      }
    }

    /* === Floating Gold Hearts (Click Effect) === */
    .floating-heart {
      position: fixed;
      color: var(--gold);
      font-size: 1.5rem;
      pointer-events: none;
      z-index: 999;
      animation: floatUp 1.5s ease-out forwards;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        transform: translate(-50%, -100px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -180px) scale(0.8);
      }
    }

    /* === Form & Buttons Styles === */
    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: var(--gold-light);
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }

    .btn {
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      color: #000;
      border: none;
      padding: 12px 25px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: opacity 0.3s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* === Dropdown Add to Calendar === */
    .dropdown {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background: rgba(15, 15, 15, 0.95);
      border: 1px solid var(--glass-border);
      min-width: 100%;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 8px;
      z-index: 10;
      overflow: hidden;
      margin-top: 5px;
    }

    .dropdown-content a {
      color: #fff;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      text-align: right;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .dropdown-content a:hover {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold);
    }

    .dropdown.active .dropdown-content {
      display: block;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--gold-light);
    }
  </style>
</head>
<body>

  <!-- 1. زر الصوت والنوتات المتطايرة -->
  <div class="music-control-container">
    <button class="music-btn" id="musicToggle" onclick="toggleMusic()">
      <i class="fa-solid fa-music"></i>
    </button>
  </div>
  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <!-- بطاقة الدعوة مع Shimmer Effect -->
  <div class="card">
    <h1>دعوة زفاف ملوكية</h1>
    <p>يشرفنا حضوركم لمشاركتنا فرحتنا في أجمل ليلة</p>
    
    <!-- 2.3 قائمة إضافة إلى التقويم Dropdown -->
    <div class="dropdown" id="calendarDropdown">
      <button class="btn" onclick="toggleCalendarDropdown()">
        <i class="fa-regular fa-calendar-plus"></i> إضافة إلى التقويم
      </button>
      <div class="dropdown-content">
        <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=حفل+زفاف&dates=20261115T180000Z/20261115T220000Z&details=مرحباً+بكم+في+حفل+الزفاف&location=القاعة+الملكية" target="_blank">
          <i class="fa-brands fa-google"></i> Google Calendar
        </a>
        <a href="#" onclick="downloadICS(); return false;">
          <i class="fa-solid fa-file-export"></i> Apple / Outlook (تحميل ملف .ics)
        </a>
      </div>
    </div>
  </div>

  <!-- بطاقة الـ RSVP والربط بـ Google Sheets -->
  <div class="card">
    <h2 style="color: var(--gold); margin-bottom: 20px;">تأكيد الحضور (RSVP)</h2>
    <form id="rsvpForm" onsubmit="submitRSVP(event)">
      <div class="form-group">
        <label for="guestName">الاسم الكريم:</label>
        <input type="text" id="guestName" required placeholder="أدخل اسمك هنا">
      </div>
      <div class="form-group">
        <label for="attendance">هل ستشرفنا بالحضور؟</label>
        <select id="attendance">
          <option value="حاضر">يشرفني الحضور بكل سرور</option>
          <option value="اعتذار">أعتذر لعدم التمكن من الحضور</option>
        </select>
      </div>
      <button type="submit" class="btn" id="submitBtn">تأكيد الإرسال</button>
    </form>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    // ==========================================
    // 1.1 + 1.2 Music Control & Floating Notes
    // ==========================================
    const audio = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    let musicInterval = null;

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
        startFloatingNotes();
      } else {
        audio.pause();
        musicBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
        stopFloatingNotes();
      }
    }

    function startFloatingNotes() {
      musicInterval = setInterval(() => {
        const note = document.createElement('i');
        note.className = 'fa-solid fa-note-sticky note';
        // التنويع بين شكل النوتات
        const icons = ['fa-music', 'fa-note-sticky'];
        note.classList.add(icons[Math.floor(Math.random() * icons.length)]);
        
        musicBtn.appendChild(note);
        setTimeout(() => note.remove(), 2000);
      }, 600);
    }

    function stopFloatingNotes() {
      clearInterval(musicInterval);
    }

    // ==========================================
    // 2.1 Double-Tap / Click Floating Hearts Effect
    // ==========================================
    document.body.addEventListener('click', (e) => {
      // منع إطلاق القلوب عند الضغط على الأزرار أو مدخلات النص
      if (e.target.closest('button') || e.target.closest('input') || e.target.closest('select') || e.target.closest('a')) return;

      const heart = document.createElement('i');
      heart.className = 'fa-solid fa-heart floating-heart';
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1500);
    });

    // ==========================================
    // 2.2 RSVP Integration with Google Sheets
    // ==========================================
    // 🔴 استبدل الرابط أدناه برابط Web App الخاص بك بعد نشره من Google Apps Script
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

    function submitRSVP(e) {
      e.preventDefault();
      const name = document.getElementById('guestName').value;
      const status = document.getElementById('attendance').value;
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      statusMsg.innerText = "جاري إرسال ردك...";
      submitBtn.disabled = true;

      // إرسال البيانات
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, status: status })
      }).then(() => {
        statusMsg.innerText = "شكرًا لك! تم تسجيل ردك بنجاح ✨";
        document.getElementById('rsvpForm').reset();
        submitBtn.disabled = false;
      }).catch(err => {
        statusMsg.innerText = "حدث خطأ، يرجى المحاولة مرة أخرى.";
        submitBtn.disabled = false;
      });
    }

    // ==========================================
    // 2.3 Add to Calendar (Dropdown & .ics File)
    // ==========================================
    function toggleCalendarDropdown() {
      document.getElementById('calendarDropdown').classList.toggle('active');
    }

    // إغلاق القائمة عند النقر خارجها
    window.onclick = function(event) {
      if (!event.target.matches('.btn') && !event.target.closest('.dropdown')) {
        const dropdown = document.getElementById('calendarDropdown');
        if (dropdown.classList.contains('active')) {
          dropdown.classList.remove('active');
        }
      }
    }

    // إنشاء ملف .ics لتطبيقات Apple Calendar و Outlook
    function downloadICS() {
      const icsData = 
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Wedding Invitation//AR
BEGIN:VEVENT
SUMMARY:حفل زفاف ملوكي
DESCRIPTION:مرحباً بكم في حفل زفافنا، يسعدنا حضوركم!
LOCATION:القاعة الملكية
DTSTART:20261115T180000Z
DTEND:20261115T220000Z
END:VEVENT
END:VCALENDAR`;

      const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'wedding-event.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
